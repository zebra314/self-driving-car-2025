services:
  ros1_dev:
    build: .
    container_name: ros1_container
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./src:/ros_ws/src
      # Mount ITRI Dataset Directory
      - ./guanfu_road_clipped.bag:/ros_ws/data/guanfu_road_clipped.bag
    stdin_open: true
    tty: true
